# Production stack: Postgres + web app + Caddy (HTTPS). Run with:
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: htake
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: htake
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U htake -d htake"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: .
      target: runner
    restart: unless-stopped
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://htake:${POSTGRES_PASSWORD}@db:5432/htake
      BETTER_AUTH_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # One-off tasks: docker compose -f docker-compose.prod.yml --env-file .env.production run --rm tools
  tools:
    profiles: ["tools"]
    build:
      context: .
      target: tools
    env_file: .env.production
    environment:
      DATABASE_URL: postgres://htake:${POSTGRES_PASSWORD}@db:5432/htake
      BETTER_AUTH_URL: https://${DOMAIN}
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
